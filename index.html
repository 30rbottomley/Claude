<html lang="en" class="light">
<head>

    <title>Claude Chat - Private</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://zsboyqtzevsmxfccwaov.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzYm95cXR6ZXZzbXhmY2N3YW92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTA0MzgsImV4cCI6MjExMDAyNjQzOH0.l3c-HEVN4Ss0_TfwCEYAJDvFmT0XcX8NA7qwwwNSXoA';
    </script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background-color: #475569; }
        .message-content pre { background-color: #1e293b; color: #f8fafc; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 8px; margin-bottom: 8px; }
        .message-content code { font-family: monospace; background-color: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 4px; }
        .dark .message-content code { background-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 h-screen flex flex-col font-sans overflow-hidden transition-colors duration-200">

    <!-- Auth Section -->
    <div id="auth-section" class="flex-1 flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 dark:border-slate-700">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 mb-4">
                    <i class="fa-solid fa-lock text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Private Portal</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Sign in to access AI</p>
            </div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white">
                </div>
                <div id="auth-error" class="text-red-500 text-sm hidden bg-red-50 dark:bg-red-900/20 p-3 rounded-lg"></div>
                <div class="pt-2">
                    <button type="button" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Chat Section -->
    <div id="chat-section" class="hidden flex-1 flex flex-col h-full max-w-5xl mx-auto w-full bg-white dark:bg-slate-800 shadow-2xl border-x border-slate-200 dark:border-slate-700">
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-robot text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h2 class="font-bold text-lg text-slate-800 dark:text-white leading-tight">AI Assistant</h2>
                        <span id="role-badge" class="hidden text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400">Admin</span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="user-email-display">user@example.com</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-admin" class="hidden p-2.5 text-slate-500 hover:text-amber-600 hover:bg-amber-50 dark:hover:bg-slate-700 rounded-full transition" title="Admin Panel"><i class="fa-solid fa-users-gear text-lg"></i></button>
                <button id="btn-clear-chat" class="p-2.5 text-slate-500 hover:text-orange-600 hover:bg-orange-50 dark:hover:bg-slate-700 rounded-full transition" title="Clear Chat History"><i class="fa-solid fa-trash-can text-lg"></i></button>
                <button id="btn-theme" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-slate-700 rounded-full transition" title="Toggle Theme"><i class="fa-solid fa-moon text-lg" id="theme-icon"></i></button>
                <button id="btn-logout" class="p-2.5 text-slate-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-slate-700 rounded-full transition" title="Log Out"><i class="fa-solid fa-arrow-right-from-bracket text-lg"></i></button>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 chat-scroll space-y-6 bg-slate-50/50 dark:bg-slate-900/50">
            <div id="empty-state" class="text-center text-slate-400 dark:text-slate-500 mt-10 text-sm">
                <i class="fa-regular fa-comments text-4xl mb-3 opacity-50"></i>
                <p>Send a message to start the conversation.</p>
            </div>
        </div>

        <div class="p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700">
            <form id="chat-form" class="relative max-w-4xl mx-auto flex items-end gap-2">
                <textarea id="chat-input" rows="1" class="w-full bg-slate-100 dark:bg-slate-700 border border-transparent focus:bg-white dark:focus:bg-slate-900 focus:border-indigo-400 rounded-2xl pl-4 pr-12 py-3 outline-none resize-none transition chat-scroll max-h-32 text-slate-900 dark:text-white placeholder-slate-400" placeholder="Message AI..."></textarea>
                <button type="submit" id="btn-send" class="absolute right-2 bottom-1.5 p-2 w-10 h-10 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md transition flex justify-center items-center disabled:opacity-50">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[80vh] flex flex-col border border-slate-200 dark:border-slate-700">
            <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-users-gear mr-2 text-indigo-500"></i> Admin Panel - User Roster</h2>
                <button id="btn-close-admin" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 dark:border-slate-700 text-sm text-slate-500">
                            <th class="pb-3 font-medium">User Email</th>
                            <th class="pb-3 font-medium">Role</th>
                            <th class="pb-3 font-medium">AI Instructions (System Note)</th>
                            <th class="pb-3 font-medium">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roster-tbody" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (error) {
            console.error("Supabase config error:", error);
        }

        let currentUser = null;
        let currentUserProfile = null;
        let currentUserNote = "";
        let chatHistory = [];
        let isDarkMode = localStorage.getItem('theme') === 'dark';

        const authSection = document.getElementById('auth-section');
        const chatSection = document.getElementById('chat-section');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        
        const userEmailDisplay = document.getElementById('user-email-display');
        const chatContainer = document.getElementById('chat-container');
        const emptyState = document.getElementById('empty-state');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');
        const btnSend = document.getElementById('btn-send');
        const btnClearChat = document.getElementById('btn-clear-chat');

        const btnTheme = document.getElementById('btn-theme');
        const themeIcon = document.getElementById('theme-icon');

        const btnAdmin = document.getElementById('btn-admin');
        const adminModal = document.getElementById('admin-modal');
        const btnCloseAdmin = document.getElementById('btn-close-admin');
        const rosterTbody = document.getElementById('roster-tbody');
        const roleBadge = document.getElementById('role-badge');

        window.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            if(!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUIForUser(session?.user);

            supabaseClient.auth.onAuthStateChange((_event, session) => updateUIForUser(session?.user));
            
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight < 128 ? this.scrollHeight : 128) + 'px';
            });
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (this.value.trim() !== '') chatForm.dispatchEvent(new Event('submit'));
                }
            });
        });

        function initTheme() {
            if (isDarkMode || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                isDarkMode = true;
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                isDarkMode = false;
            }
        }

        btnTheme.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        async function updateUIForUser(user) {
            currentUser = user;
            if (user) {
                authSection.classList.add('hidden');
                chatSection.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
                
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                currentUserProfile = profile;
                
                if (profile && profile.role === 'admin') {
                    btnAdmin.classList.remove('hidden');
                    roleBadge.classList.remove('hidden');
                } else {
                    btnAdmin.classList.add('hidden');
                    roleBadge.classList.add('hidden');
                }

                const { data: noteData } = await supabaseClient.from('user_notes').select('note').eq('id', user.id).single();
                if (noteData) currentUserNote = noteData.note;

                loadChatHistory();
            } else {
                authSection.classList.remove('hidden');
                chatSection.classList.add('hidden');
                clearChatUI();
            }
        }

        btnLogin.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) return showAuthError("Email and password required");
            
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Logging in...`;
            
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            btnLogin.disabled = false;
            btnLogin.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Login`;
            
            if (error) showAuthError(error.message);
        });

        btnLogout.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            emailInput.value = '';
            passwordInput.value = '';
        });

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.classList.remove('hidden');
        }

        function saveChatHistory() {
            if (currentUser) localStorage.setItem(`claude_chat_${currentUser.id}`, JSON.stringify(chatHistory));
        }

        function loadChatHistory() {
            if (!currentUser) return;
            const saved = localStorage.getItem(`claude_chat_${currentUser.id}`);
            clearChatUI();
            
            if (saved) {
                chatHistory = JSON.parse(saved);
                if (chatHistory.length > 0) {
                    emptyState.classList.add('hidden');
                    chatHistory.forEach(msg => appendMessageUI(msg.role, msg.content));
                } else emptyState.classList.remove('hidden');
            } else {
                chatHistory = [];
                emptyState.classList.remove('hidden');
            }
        }

        btnClearChat.addEventListener('click', () => {
            if(confirm("Clear conversation history?")) {
                chatHistory = [];
                saveChatHistory();
                clearChatUI();
                emptyState.classList.remove('hidden');
            }
        });

        function clearChatUI() {
            chatContainer.querySelectorAll('.message-wrapper').forEach(m => m.remove());
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = chatInput.value.trim();
            if (!messageText) return;

            emptyState.classList.add('hidden');
            appendMessageUI('user', messageText);
            chatHistory.push({ role: 'user', content: messageText });
            saveChatHistory();
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            const loadingId = appendLoadingIndicator();
            btnSend.disabled = true;

            try {
                const { data, error } = await supabaseClient.functions.invoke('chat', {
                    body: { messages: chatHistory, system_prompt: currentUserNote }
                });

                if (error) throw error;
                if (data.error) throw new Error(data.error.message || data.error);
                
                document.getElementById(loadingId).remove();
                const assistantMessage = data.content[0].text;
                
                appendMessageUI('assistant', assistantMessage);
                chatHistory.push({ role: 'assistant', content: assistantMessage });
                saveChatHistory();
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                appendMessageUI('system', `Error: ${error.message}`);
                chatHistory.pop();
            } finally {
                btnSend.disabled = false;
                chatInput.focus();
            }
        });

        function appendMessageUI(role, content) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const inner = document.createElement('div');
            if (role === 'user') {
                inner.className = 'max-w-[80%] md:max-w-[70%] rounded-2xl px-5 py-3.5 bg-indigo-600 text-white shadow-sm rounded-tr-sm message-content';
                inner.textContent = content; 
            } else if (role === 'assistant') {
                inner.className = 'max-w-[80%] md:max-w-[70%] rounded-2xl px-5 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 shadow-sm rounded-tl-sm message-content text-base leading-relaxed';
                let formatted = escapeHTML(content);
                formatted = formatted.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
                formatted = formatted.replace(/\n/g, '<br>');
                inner.innerHTML = formatted;
            } else {
                inner.className = 'w-full text-center text-sm text-red-500 bg-red-50 dark:bg-red-900/20 py-2 rounded-lg border border-red-100';
                inner.innerHTML = content;
            }
            wrapper.appendChild(inner);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `message-wrapper flex w-full justify-start`;
            wrapper.innerHTML = `
                <div class="max-w-[80%] md:max-w-[70%] rounded-2xl px-5 py-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm rounded-tl-sm flex gap-2 items-center">
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                </div>`;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }

        btnAdmin.addEventListener('click', async () => {
            adminModal.classList.remove('hidden');
            await loadRoster();
        });

        btnCloseAdmin.addEventListener('click', () => adminModal.classList.add('hidden'));

        async function loadRoster() {
            rosterTbody.innerHTML = '<tr><td colspan="4" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin"></i> Loading roster...</td></tr>';
            
            const { data: profiles, error: pError } = await supabaseClient.from('profiles').select('*').order('email');
            const { data: notes } = await supabaseClient.from('user_notes').select('*');

            if (pError) return rosterTbody.innerHTML = `<tr><td colspan="4" class="text-red-500 py-4">Error: ${pError.message}</td></tr>`;

            rosterTbody.innerHTML = '';
            profiles.forEach(profile => {
                const userNote = notes?.find(n => n.id === profile.id)?.note || '';
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/20';
                tr.innerHTML = `
                    <td class="py-3 pr-2 text-slate-800 dark:text-slate-200">${profile.email}</td>
                    <td class="py-3 pr-2">
                        <select class="role-select bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-2 py-1 text-slate-800 dark:text-slate-200 outline-none text-xs">
                            <option value="user" ${profile.role === 'user' ? 'selected' : ''}>User</option>
                            <option value="admin" ${profile.role === 'admin' ? 'selected' : ''}>Admin</option>
                        </select>
                    </td>
                    <td class="py-3 pr-2 w-1/2">
                        <textarea class="note-input w-full bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-3 py-1.5 text-slate-800 dark:text-slate-200 outline-none resize-none h-10 text-xs" placeholder="E.g., You are a strict tutor...">${escapeHTML(userNote)}</textarea>
                    </td>
                    <td class="py-3">
                        <button class="btn-save-user bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1.5 rounded transition text-xs font-medium" data-id="${profile.id}">Save</button>
                    </td>
                `;
                rosterTbody.appendChild(tr);
            });

            document.querySelectorAll('.btn-save-user').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const row = e.target.closest('tr');
                    const role = row.querySelector('.role-select').value;
                    const note = row.querySelector('.note-input').value;
                    
                    e.target.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                    e.target.disabled = true;

                    await supabaseClient.from('profiles').update({ role }).eq('id', id);
                    const { data: existingNote } = await supabaseClient.from('user_notes').select('id').eq('id', id).single();
                    
                    if (existingNote) await supabaseClient.from('user_notes').update({ note }).eq('id', id);
                    else await supabaseClient.from('user_notes').insert({ id, note });

                    if (id === currentUser.id) currentUserNote = note;

                    e.target.innerHTML = '<i class="fa-solid fa-check"></i> Saved';
                    setTimeout(() => { e.target.innerHTML = 'Save'; e.target.disabled = false; }, 2000);
                });
            });
        }
    </script>
</body>
</html>
